name: Build APK

# Gera APKs de teste (release, por arquitetura) na nuvem a cada push no app.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7

      - name: Restaura config do Firebase (secrets)
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/android/app/google-services.json
          echo "${{ secrets.FIREBASE_OPTIONS_DART }}" | base64 -d > app/lib/firebase_options.dart

      - name: Dependências
        working-directory: app
        run: flutter pub get

      - name: Build APK (release, por arquitetura)
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Publica os APKs como artefato
        uses: actions/upload-artifact@v4
        with:
          name: lista-app-apks
          path: app/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
