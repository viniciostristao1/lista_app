name: Build APK

# Gera APKs de teste (release, por arquitetura) na nuvem a cada push no app.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7

      - name: Restaura config do Firebase (secrets)
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/android/app/google-services.json
          echo "${{ secrets.FIREBASE_OPTIONS_DART }}" | base64 -d > app/lib/firebase_options.dart

      - name: Assinatura de release (keystore + key.properties)
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/android/app/upload-keystore.jks
          cat > app/android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Dependências
        working-directory: app
        run: flutter pub get

      - name: Build APK arm64 (release)
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      - name: Build AAB (release, para a Play Store)
        working-directory: app
        run: flutter build appbundle --release

      # Publica no release rolling "ci-latest" (assets de release NÃO contam na
      # cota de artefatos do Actions). Baixamos daqui e cortamos o release nomeado.
      - name: Publica APK+AAB no release ci-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: CI build (rolling — APK arm64 + AAB do último push)
          prerelease: true
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
